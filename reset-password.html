<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova Senha — CDM Central</title>
  <link rel="icon" type="image/png" href="assets/logos/cdm-icon.png?v=20260618d">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-logo">
        <img src="assets/logos/cdm-marketing-white.png?v=20260618d" alt="CDM marketing" class="auth-logo-full">
        <img src="assets/logos/cdm-icon.png?v=20260618d" alt="CDM marketing" class="auth-logo-icon">
      </div>
      <h1 class="auth-title">Nova senha</h1>
      <p class="auth-subtitle">Defina sua nova senha de acesso</p>

      <form id="password-form">
        <div class="form-group">
          <label class="form-label" for="password">Nova senha</label>
          <input class="form-input" type="password" id="password" required minlength="6" placeholder="Mínimo 6 caracteres">
        </div>
        <div class="form-group">
          <label class="form-label" for="confirm">Confirmar senha</label>
          <input class="form-input" type="password" id="confirm" required placeholder="Repita a senha">
        </div>
        <button type="submit" class="auth-btn">Salvar senha</button>
        <div id="pwd-msg" hidden></div>
      </form>
    </div>
  </div>

  <script src="js/vendor/supabase.min.js"></script>
  <script type="module">
    import { updatePassword } from './js/auth.js';

    document.getElementById('password-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const pwd = document.getElementById('password').value;
      const confirm = document.getElementById('confirm').value;
      const msg = document.getElementById('pwd-msg');

      if (pwd !== confirm) {
        msg.className = 'form-error';
        msg.textContent = 'As senhas não coincidem';
        msg.hidden = false;
        return;
      }

      try {
        await updatePassword(pwd);
        msg.className = 'form-success';
        msg.textContent = 'Senha atualizada! Redirecionando...';
        msg.hidden = false;
        setTimeout(() => window.location.replace('app.html'), 1500);
      } catch (err) {
        msg.className = 'form-error';
        msg.textContent = err.message;
        msg.hidden = false;
      }
    });
  </script>
</body>
</html>
