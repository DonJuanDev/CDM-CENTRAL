<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — CDM Central</title>
  <link rel="icon" type="image/png" href="assets/logos/cdm-icon.png?v=20260618d">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-logo">
        <img src="assets/logos/cdm-marketing-white.png?v=20260618d" alt="CDM marketing" class="auth-logo-full">
        <img src="assets/logos/cdm-icon.png?v=20260618d" alt="CDM marketing" class="auth-logo-icon">
      </div>
      <h1 class="auth-title">Entrar</h1>
      <p class="auth-subtitle">Sistema operacional de marketing digital</p>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="email">E-mail</label>
          <input class="form-input" type="email" id="email" required autocomplete="email" placeholder="seu@email.com">
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Senha</label>
          <input class="form-input" type="password" id="password" required autocomplete="current-password" placeholder="••••••••">
        </div>
        <button type="submit" class="auth-btn" id="login-btn">Entrar</button>
        <div id="login-error" class="form-error" hidden></div>
      </form>

      <div class="auth-links">
        <a href="forgot-password.html">Esqueceu a senha?</a>
      </div>
    </div>
  </div>

  <script src="js/vendor/supabase.min.js"></script>
  <script type="module">
    import { getSession, signIn } from './js/auth.js';

    const session = await getSession();
    const lastView = localStorage.getItem('cdm-last-view');
    const appUrl = lastView ? `app.html#/${lastView}` : 'app.html';
    if (session) window.location.replace(appUrl);

    const form = document.getElementById('login-form');
    const errorEl = document.getElementById('login-error');
    const btn = document.getElementById('login-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.hidden = true;
      btn.disabled = true;
      btn.textContent = 'Entrando...';

      try {
        await signIn(document.getElementById('email').value, document.getElementById('password').value);
        const lastView = localStorage.getItem('cdm-last-view');
        window.location.replace(lastView ? `app.html#/${lastView}` : 'app.html');
      } catch (err) {
        errorEl.textContent = err.message === 'Invalid login credentials'
          ? 'E-mail ou senha incorretos'
          : err.message;
        errorEl.hidden = false;
      } finally {
        btn.disabled = false;
        btn.textContent = 'Entrar';
      }
    });
  </script>
</body>
</html>
