# CDM Central - Supabase Configuration
# https://supabase.com/docs/guides/cli/config

project_id = "dsutsjvqrjtkextwcpgl"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[auth]
enabled = true
site_url = "http://127.0.0.1:5501"
additional_redirect_urls = ["http://127.0.0.1:5501/reset-password.html", "http://localhost:5501/reset-password.html"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[storage]
enabled = true
file_size_limit = "500MiB"

[functions.integrations]
verify_jwt = true
