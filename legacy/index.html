<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CDM Central - Sistema Operacional de Marketing Digital">
  <title>CDM Central</title>
  <link rel="icon" type="image/png" href="assets/logos/cdm-icon.png?v=20260618d">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app" class="app">
    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <img src="assets/logos/cdm-marketing-white.png?v=20260618d" alt="CDM marketing" class="logo-img logo-img-full">
          <img src="assets/logos/cdm-icon.png?v=20260618d" alt="CDM marketing" class="logo-img logo-img-icon">
        </div>
        <button id="sidebar-toggle" class="sidebar-toggle" aria-label="Recolher menu">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
      </div>

      <nav id="sidebar-nav" class="sidebar-nav"></nav>

      <div class="sidebar-footer">
        <button id="theme-toggle" class="theme-toggle" aria-label="Alternar tema">
          <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
          <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          <span class="theme-label">Tema</span>
        </button>
      </div>
    </aside>

    <!-- Main -->
    <div class="main-wrapper">
      <!-- Header -->
      <header class="header">
        <div class="header-left">
          <button id="mobile-menu" class="mobile-menu-btn" aria-label="Menu">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
          </button>
          <div class="search-wrapper">
            <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
            <input type="text" id="global-search" class="search-input" placeholder="Buscar em tudo... (Ctrl+K)" autocomplete="off">
            <kbd class="search-kbd">⌘K</kbd>
          </div>
        </div>
        <div class="header-right">
          <button id="fullscreen-btn" class="header-btn" aria-label="Tela cheia" title="Tela cheia (F)">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
          </button>
          <button id="notifications-btn" class="header-btn" aria-label="Notificações">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            <span id="notif-badge" class="notif-badge">5</span>
          </button>
          <div class="user-menu">
            <button id="user-btn" class="user-btn">
              <span class="user-avatar">A</span>
              <span class="user-name">Admin CDM</span>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
            </button>
          </div>
        </div>
      </header>

      <!-- Content -->
      <main id="main-content" class="main-content"></main>
    </div>

    <!-- Search Modal -->
    <div id="search-modal" class="modal-overlay hidden">
      <div class="search-modal">
        <div class="search-modal-header">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <input type="text" id="search-modal-input" placeholder="Buscar clientes, tarefas, campanhas..." autocomplete="off">
          <kbd>ESC</kbd>
        </div>
        <div id="search-results" class="search-results"></div>
      </div>
    </div>

    <!-- Notifications Panel -->
    <div id="notifications-panel" class="notifications-panel hidden">
      <div class="panel-header">
        <h3>Alertas</h3>
        <button id="close-notifications" class="panel-close">&times;</button>
      </div>
      <div id="notifications-list" class="notifications-list"></div>
    </div>

    <!-- Detail Modal -->
    <div id="detail-modal" class="modal-overlay hidden">
      <div class="detail-modal">
        <div class="detail-modal-header">
          <h2 id="detail-modal-title"></h2>
          <button id="close-detail-modal" class="panel-close">&times;</button>
        </div>
        <div id="detail-modal-body" class="detail-modal-body"></div>
      </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Overlay -->
    <div id="overlay" class="overlay hidden"></div>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
