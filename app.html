<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CDM Central</title>
  <link rel="icon" type="image/png" href="assets/logos/cdm-icon.png?v=20260618d">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=20260626c">
  <link rel="stylesheet" href="css/auth.css?v=20260619e">
</head>
<body>
  <div id="app" class="app">
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <img src="assets/logos/cdm-marketing-white.png?v=20260618d" alt="CDM marketing" class="logo-img logo-img-full">
          <img src="assets/logos/cdm-icon.png?v=20260618d" alt="CDM marketing" class="logo-img logo-img-icon">
        </div>
        <button id="sidebar-toggle" class="sidebar-toggle" aria-label="Recolher menu">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
      </div>
      <nav id="sidebar-nav" class="sidebar-nav"></nav>
      <div class="sidebar-footer">
        <button id="theme-toggle" class="theme-toggle" aria-label="Alternar tema">
          <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
          <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          <span class="theme-label">Tema</span>
        </button>
      </div>
    </aside>

    <div class="main-wrapper">
      <header class="header">
        <div class="header-left">
          <button id="mobile-menu" class="mobile-menu-btn" aria-label="Menu">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
          </button>
          <div class="search-wrapper">
            <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
            <input type="text" id="global-search" class="search-input" placeholder="Buscar... (Ctrl+K)" autocomplete="off">
          </div>
        </div>
        <div class="header-right">
          <button id="notifications-btn" class="header-btn" aria-label="Notificações">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            <span id="notif-badge" class="notif-badge hidden">0</span>
          </button>
          <div class="user-menu">
            <button id="user-btn" class="user-btn">
              <span class="user-avatar" id="user-avatar">A</span>
              <span class="user-name" id="user-name">...</span>
              <span class="role-badge" id="user-role"></span>
            </button>
            <div id="user-dropdown" class="hidden" style="position:absolute;right:24px;top:52px;background:var(--bg-card);border:1px solid var(--border-color);border-radius:var(--radius-md);padding:8px;min-width:160px;z-index:200">
              <button class="btn btn-ghost" style="width:100%;justify-content:flex-start" id="logout-btn">Sair</button>
            </div>
          </div>
        </div>
      </header>
      <main id="main-content" class="main-content">
        <div class="loading"><div class="spinner"></div><p style="margin-top:12px;color:var(--text-tertiary)">Iniciando...</p></div>
      </main>
    </div>

    <div id="detail-modal" class="modal-overlay hidden">
      <div class="detail-modal">
        <div class="detail-modal-header">
          <h2 id="detail-modal-title"></h2>
          <button id="close-detail-modal" class="panel-close">&times;</button>
        </div>
        <div id="detail-modal-body" class="detail-modal-body"></div>
      </div>
    </div>

    <div id="notifications-panel" class="notifications-panel hidden">
      <div class="panel-header">
        <h3>Notificações</h3>
        <button id="close-notifications" class="panel-close" aria-label="Fechar">&times;</button>
      </div>
      <div id="notifications-toolbar" class="notifications-toolbar hidden">
        <button id="mark-all-notifications" class="btn btn-ghost btn-sm" type="button">Marcar todas como lidas</button>
      </div>
      <div id="notifications-list" class="notifications-list"></div>
    </div>

    <div id="overlay" class="overlay hidden"></div>

    <div id="upload-progress" class="upload-progress-overlay hidden" aria-live="polite" aria-busy="true">
      <div class="upload-progress-card">
        <div class="spinner upload-progress-spinner"></div>
        <h3 id="upload-progress-title">Enviando arquivo...</h3>
        <p id="upload-progress-name" class="upload-progress-name"></p>
        <div class="progress-bar upload-progress-bar"><div id="upload-progress-fill" class="progress-fill"></div></div>
        <p id="upload-progress-meta" class="upload-progress-meta"></p>
      </div>
    </div>

    <div id="file-context-menu" class="file-context-menu hidden" role="menu">
      <button type="button" id="file-context-delete" class="file-context-item file-context-danger" role="menuitem">Excluir pasta</button>
    </div>

    <div id="toast-container" class="toast-container"></div>
  </div>

  <script src="js/vendor/supabase.min.js"></script>
  <script type="module" src="js/app.js?v=20260626d"></script>
</body>
</html>
