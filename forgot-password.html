<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar Senha — CDM Central</title>
  <link rel="icon" type="image/png" href="assets/logos/cdm-icon.png?v=20260618d">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-logo">
        <img src="assets/logos/cdm-marketing-white.png?v=20260618d" alt="CDM marketing" class="auth-logo-full">
        <img src="assets/logos/cdm-icon.png?v=20260618d" alt="CDM marketing" class="auth-logo-icon">
      </div>
      <h1 class="auth-title">Recuperar senha</h1>
      <p class="auth-subtitle">Enviaremos um link para redefinir sua senha</p>

      <form id="reset-form">
        <div class="form-group">
          <label class="form-label" for="email">E-mail</label>
          <input class="form-input" type="email" id="email" required placeholder="seu@email.com">
        </div>
        <button type="submit" class="auth-btn" id="reset-btn">Enviar link</button>
        <div id="reset-msg" hidden></div>
      </form>

      <div class="auth-links">
        <a href="login.html">← Voltar ao login</a>
      </div>
    </div>
  </div>

  <script src="js/vendor/supabase.min.js"></script>
  <script type="module">
    import { resetPassword } from './js/auth.js';

    document.getElementById('reset-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('reset-btn');
      const msg = document.getElementById('reset-msg');
      btn.disabled = true;

      try {
        await resetPassword(document.getElementById('email').value);
        msg.className = 'form-success';
        msg.textContent = 'Link enviado! Verifique seu e-mail.';
        msg.hidden = false;
      } catch (err) {
        msg.className = 'form-error';
        msg.textContent = err.message;
        msg.hidden = false;
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
